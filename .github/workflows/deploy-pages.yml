name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        env:
          NITRO_PRESET: github-pages
          NUXT_APP_BASE_URL: /portfolio/
          # Cloudflare's public test key (always passes) — the contact form
          # can't send mail from GitHub Pages anyway since it's static hosting,
          # this just keeps the Turnstile widget from erroring out visually.
          NUXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npx nuxt generate

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
